name: Refresh Library (NeoDB)

# Periodically triggers a Cloudflare Pages rebuild so the Library (书影音)
# picks up new NeoDB marks. The build re-fetches NeoDB and renders fresh
# static pages.
#
# Setup (one-time):
#   1. Cloudflare Pages → your project → Settings → Builds & deployments →
#      Deploy hooks → create one → copy its URL.
#   2. GitHub repo → Settings → Secrets and variables → Actions →
#      New repository secret → name: CF_DEPLOY_HOOK, value: <that URL>.
#   3. Make sure NEODB_TOKEN (+ optional NEODB_INSTANCE) are set as
#      Cloudflare Pages *build* environment variables, or the build falls
#      back to sample data.

on:
  schedule:
    # GitHub cron is UTC-only. Every 3h during local active hours, quiet overnight:
    #   UTC 01,04,07,10,13,16  ==  UTC+8 (Beijing) 09:00,12:00,15:00,18:00,21:00,00:00
    #   (no builds UTC+8 00:00–09:00)
    - cron: "0 1,4,7,10,13,16 * * *"
  workflow_dispatch: {} # manual "Run workflow" button for an instant sync

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy
        run: |
          if [ -z "${{ secrets.CF_DEPLOY_HOOK }}" ]; then
            echo "::notice::CF_DEPLOY_HOOK not set yet — skipping (no rebuild). Add the secret to enable auto-rebuilds; see this file's header."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
          echo "Triggered a Cloudflare Pages rebuild."
